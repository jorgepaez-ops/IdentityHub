# Configuración del análisis automático de SonarCloud.
#
# security/evidence/** guarda salidas de escáneres almacenadas como evidencia
# "antes" (línea base VULN-001): contienen los secretos sembrados a propósito, no
# son código del producto. El análisis automático no admite sonar.issue.ignore.*,
# así que se excluye la ruta completa.
sonar.exclusions=security/evidence/**
