# No afectado — herramientas de desarrollo y escaneo (tools/go.mod).
#
# GO-2026-5932 (golang.org/x/crypto/openpgp y subpaquetes) no tiene versión
# corregida: es un aviso del paquete completo, no de una versión concreta. Llega
# como dependencia indirecta de las herramientas fijadas en este módulo
# (oapi-codegen, sqlc, govulncheck, gosec). Esas herramientas solo se usan en
# desarrollo y en CI; nunca se incluyen en una imagen ni se ejecutan en
# producción, y osv-scanner lo marca no invocado. Además, `go list -deps` de las
# cuatro herramientas no lista x/crypto/openpgp (2026-10-12). Misma decisión que
# backend/osv-scanner.toml (VULN-028): no afectado, exclusión permanente.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "VULN-028: no afectado. Los paquetes golang.org/x/crypto/openpgp* no se importan en ninguna herramienta (oapi-codegen, sqlc, govulncheck, gosec; go list -deps no los lista); el aviso no tiene versión corregida por diseño del paquete abandonado y las herramientas no se distribuyen en ninguna imagen."
