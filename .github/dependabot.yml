version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # Herramientas de desarrollo y escaneo fijadas en tools/go.mod (oapi-codegen,
  # sqlc, govulncheck, gosec). Se instalan sin @versión: go.sum las verifica.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
