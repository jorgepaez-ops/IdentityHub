# ═══════════════════════════════════════════════════════════════════════════
#  Pipeline principal — los gates ROMPEN la build.
#
#  Estado esperado hoy: EN ROJO. El repositorio está en la línea base
#  deliberadamente vulnerable (specs/adr/0007) y varios gates encuentran lo que
#  se sembró para ellos. Pasará a verde durante la fase de remediación.
#  Para ver los hallazgos sin bloquear, está baseline-scan.yml.
#
#  Jobs 1–10 de la tabla del plan; el 7 (E2E con Playwright contra el stack
#  completo de docker compose) se agregó en T14e y el 11 (DAST con OWASP ZAP,
#  rompe con riesgo medio o más) en T15a. Los de release (SBOM, firma,
#  publicación) se incorporan en la semana 3.
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# AM-022 — El token por defecto solo lee. Cada job amplía lo mínimo que necesite.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Go 1.26: chi >= 5.3.0 exige go 1.23 y los avisos de la biblioteca estándar solo se
  # corrigen a partir de Go 1.25.13 (decisión Q11 ampliada, 2026-09-21). Subido a
  # 1.26 en T34b (decisión Q11 amendment 2, 2026-09-26, autorizado por el usuario):
  # golang.org/x/crypto >= 0.56.0 (VULN-028) declara "go 1.26.0" en su propio go.mod.
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  # ── 1. Los specs son la fuente de verdad ────────────────────────────────
  spec-drift:
    name: 1 · Deriva entre specs y código
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar el contrato OpenAPI
        run: |
          python3 -m pip install --quiet 'openapi-spec-validator==0.7.1'
          python3 -m openapi_spec_validator specs/03-api/openapi.yaml

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Regenerar la API Go
        working-directory: backend
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
          go generate ./internal/api

      - name: Regenerar consultas SQL con sqlc
        run: |
          GOTOOLCHAIN=go1.26.2 go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" generate

      # Sin `cache: npm`: todavía no hay package-lock.json (lo versiona T25) y
      # setup-node falla si la ruta de dependencias no existe.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerar los tipos de la API
        working-directory: frontend
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run gen:api

      # T14d — correspondencia 1 a 1 escenario Gherkin ↔ prueba E2E (stdlib, sin red).
      - name: Pruebas del verificador de trazabilidad
        run: python3 scripts/traceability_test.py

      # Pruebas del gate de ZAP (stdlib, sin red): el gate decide el job 11.
      - name: Pruebas del gate de ZAP
        run: python3 scripts/zap_gate_test.py

      - name: Regenerar la matriz de trazabilidad
        run: python3 scripts/traceability.py

      - name: El árbol de trabajo debe quedar limpio
        run: |
          # git diff omite archivos sin seguimiento; status los hace fallar también.
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # ── 2. Estilo y tipos ───────────────────────────────────────────────────
  lint:
    name: 2 · Lint y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # golangci-lint v2: la v1 se compila con Go 1.22 y no analiza código que apunte a Go 1.26.
      - name: golangci-lint (incluye gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=5m

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            contabilidad/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Comprobación de tipos
        working-directory: frontend
        run: npm run typecheck

      # T13 — la SPA de Contabilidad pasa por los mismos gates que la consola.
      - name: Instalar dependencias de Contabilidad
        working-directory: contabilidad
        run: npm ci --ignore-scripts

      - name: ESLint (Contabilidad)
        working-directory: contabilidad
        run: npm run lint

      - name: Comprobación de tipos (Contabilidad)
        working-directory: contabilidad
        run: npm run typecheck

      - name: Hadolint sobre los Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Hadolint sobre el Dockerfile del frontend
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  # ── 3. Secretos ─────────────────────────────────────────────────────────
  secrets:
    name: 3 · Secretos en el historial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RNF-003 — El historial completo. Un secreto borrado en el último
          # commit sigue estando en el repositorio y sigue siendo válido.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Análisis estático ────────────────────────────────────────────────
  sast:
    name: 4 · SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # necesario para publicar los SARIF
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: 4b · Semgrep (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.86.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analizar
        run: semgrep scan --config=p/owasp-top-ten --config=p/golang --config=p/react --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/owasp-top-ten

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Romper la build si hay hallazgos de severidad alta
        run: semgrep scan --config=p/owasp-top-ten --config=p/golang --severity=ERROR --error

  # ── 5. Dependencias ─────────────────────────────────────────────────────
  sca:
    name: 5 · Dependencias vulnerables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # govulncheck analiza ALCANZABILIDAD: solo informa de vulnerabilidades
      # cuyo código es realmente invocable desde el nuestro. Eso elimina casi
      # todo el ruido frente a un escáner que solo lee go.mod.
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

      - name: npm audit (Contabilidad)
        working-directory: contabilidad
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

      # v1.9.0 traía Go 1.22.7 embebido: el análisis de alcanzabilidad (govulncheck)
      # fallaba porque backend/go.mod exige >= 1.26.0 (desde T34b; >= 1.25.0 antes), y
      # el escáner degradaba a listar cada advisory de go.mod sin filtrar (ruido,
      # incluida toda la stdlib). v2.6.0
      # trae Go 1.27.1 embebido (ya cumple el mínimo) y además fija GOTOOLCHAIN=auto
      # en su propio action.yml, igual que el reusable workflow oficial, por si un
      # futuro `go` del módulo supera la versión embebida. El análisis de llamadas de
      # Go viene activado por defecto (no hace falta --call-analysis=go); lo que no se
      # invoca se marca "called": false en vez de fallar. --skip-git ya no existe en
      # v2 (el root del repo se excluye por defecto salvo --include-git-root, mismo
      # efecto). --all-vulns evita que el formato tabla por defecto oculte los
      # hallazgos no invocados: sin ese flag el paso queda en verde sin listar nada.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --recursive
            --all-vulns
            ./

  # ── 6. Pruebas unitarias ────────────────────────────────────────────────
  test-unit:
    name: 6 · Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: go test
        working-directory: backend
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...

      # RNF-005 — Informe de cobertura de este job. Es solo informativo: `-short`
      # y sin el tag `integration` dejan `internal/store` y el código sqlc en 0 %,
      # así que el gate real (>= 70 %) vive en el job "6b" con Postgres real y
      # -coverpkg=./internal/... (ver su paso "Cobertura de internal/ (gate)").
      - name: Informe de cobertura
        working-directory: backend
        run: |
          go tool cover -func=coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "Cobertura actual (solo unitarias, sin gate): ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
        id: coverage

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pruebas del frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test

      - name: Pruebas de Contabilidad
        working-directory: contabilidad
        run: |
          npm ci --ignore-scripts
          npm run test

  # ── 6b. Pruebas de integración ─────────────────────────────────────────
  test-integration:
    name: 6b · Pruebas de integración
    runs-on: ubuntu-latest
    env:
      # github.run_id is a per-run, throwaway service password, not a secret.
      TEST_DATABASE_URL: ${{ format('{0}{1}{2}', 'postgres://identity:', github.run_id, '@localhost:5432/identity?sslmode=disable') }}
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: go test integration
        working-directory: backend
        run: go test -race -tags=integration -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/... ./...

      # RNF-005 — Umbral de cobertura (>= 70 %). Este job corre con Postgres real
      # y el tag `integration`, así que -coverpkg=./internal/... también atribuye
      # cobertura a internal/store y a su código sqlc generado, que el job 6
      # (unitarias, sin BD) nunca ejercita. No se excluye ningún paquete.
      - name: Cobertura de internal/ (gate)
        working-directory: backend
        run: |
          go tool cover -func=coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "Cobertura actual: ${COVERAGE}% (umbral: 70%)"
          awk -v coverage="$COVERAGE" 'BEGIN {
            if (coverage + 0 < 70) {
              printf "Cobertura insuficiente: %.1f%% (mínimo: 70%%)\n", coverage > "/dev/stderr"
              exit 1
            }
          }'
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
        id: coverage

  # ── 7. Pruebas de extremo a extremo ─────────────────────────────────────
  e2e:
    name: 7 · E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .env desechable, hosts *.localhost, make up y espera de salud (acción compuesta local).
      - name: Levantar el stack
        uses: ./.github/actions/stack-up

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # `make e2e` ejecuta `npm ci --ignore-scripts`; los navegadores van antes porque necesitan las
      # dependencias de sistema (--with-deps usa sudo) y el paquete ya instalado.
      - name: Instalar Chromium de Playwright
        working-directory: e2e
        run: |
          npm ci --ignore-scripts
          # The lockfile-pinned binary, never npx: it cannot fetch an unpinned package on demand.
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Pruebas E2E (make e2e)
        run: make e2e

      - name: Subir informe y trazas de Playwright
        # cancelled(): al vencer timeout-minutes GitHub cancela el job (no lo marca como
        # fallido); sin esto, justo ese caso se quedaría sin informe ni logs.
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Volcar los logs del stack
        if: failure() || cancelled()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail=300

      - name: Derribar el stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  # ── 8. Configuración e infraestructura ──────────────────────────────────
  iac-scan:
    name: 8 · Configuración de contenedores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # el SARIF se sube siempre; el gate va en el paso siguiente

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Romper la build si hay misconfiguración HIGH o CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ── 9 y 10. Construcción y escaneo de imágenes ──────────────────────────
  image:
    # Nombre explícito: estos checks son obligatorios en el ruleset de main y deben
    # conservar el nombre "(nombre, carpeta, target)" que tenían antes de T13.
    name: 9-10 · Construir y escanear imágenes (${{ matrix.name }}, ${{ matrix.label }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            label: backend
            context: backend
            file: backend/Dockerfile
            target: api
          - name: worker
            label: backend
            context: backend
            file: backend/Dockerfile
            target: worker
          # T13: la imagen web compila frontend/ y contabilidad/, así que su contexto es la raíz.
          - name: web
            label: frontend
            context: .
            file: frontend/Dockerfile
            target: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Construir ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: identity-hub/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Trivy sobre la imagen (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: identity-hub/${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      # RNF-004 — --ignore-unfixed: solo rompe la build lo que tiene parche
      # disponible. Bloquear por un CVE sin arreglo no protege de nada y
      # entrena al equipo a ignorar el rojo.
      - name: Romper la build si hay CVE corregibles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: identity-hub/${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: security/.trivyignore
          exit-code: "1"

  # ── 11. DAST con OWASP ZAP ──────────────────────────────────────────────
  # Mismo arranque del stack que el job 7. `make scan-dast` corre ZAP (baseline del Hub y de
  # Contabilidad + escaneo de API con el OpenAPI) y scripts/zap-gate.py rompe la build con
  # hallazgos de severidad media o más (T15; las reglas aceptadas viven en .zap/rules.tsv).
  # El arranque es el mismo del job 7: acción compuesta .github/actions/stack-up.
  dast:
    name: 11 · DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .env desechable, hosts *.localhost, make up y espera de salud (acción compuesta local).
      - name: Levantar el stack
        uses: ./.github/actions/stack-up

      - name: Escaneo DAST (make scan-dast)
        run: make scan-dast

      - name: Subir informes de ZAP
        # always(): los informes se guardan pase, falle o se cancele el job (al vencer
        # timeout-minutes GitHub lo cancela, no lo marca como fallido).
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reports-${{ github.run_id }}
          path: security/zap-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Volcar los logs del stack
        if: failure() || cancelled()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color --tail=300

      - name: Derribar el stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  # ── 12. IaC: Terraform, Dockerfiles y workflows ─────────────────────────
  # Checkov se instala con pip y versión fija (3.3.23) en vez de usar
  # bridgecrewio/checkov-action: el release v12.1347.0 de la acción trae una
  # imagen de Checkov 2.0.930 (action.yml), sin los checks actuales de AWS.
  # Las excepciones aceptadas viven en línea (#checkov:skip=ID:motivo), nunca
  # como soft_fail ni como lista global de omisión.
  iac-checkov:
    name: 12 · IaC (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Checkov
        run: |
          python3 -m pip install --quiet --only-binary :all: 'checkov==3.3.23'

      - name: Checkov (rompe ante cualquier hallazgo)
        run: |
          checkov -d . --framework terraform dockerfile github_actions \
            --compact --quiet \
            --output cli --output sarif \
            --output-file-path console,checkov-results.sarif

      # P9d — Checkov mete en el SARIF también los hallazgos omitidos en línea (llevan
      # "suppressions" con la justificación) y GitHub los muestra como alertas abiertas. Este
      # paso solo los quita del SARIF que se sube; el gate de arriba nunca los contó y la
      # excepción sigue visible en el código (#checkov:skip=ID:motivo). Si Checkov no llegó a
      # escribir el SARIF, no hace nada para no tapar el error original.
      - name: Quitar del SARIF los hallazgos ya justificados en línea
        if: always()
        run: |
          if [ ! -s checkov-results.sarif ]; then
            echo "Sin SARIF de Checkov; no hay nada que filtrar."
            exit 0
          fi
          jq '.runs[]? |= (.results = ((.results // []) | map(select((.suppressions // []) | length == 0))))' \
            checkov-results.sarif > checkov-results.filtered.sarif
          mv checkov-results.filtered.sarif checkov-results.sarif

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov
