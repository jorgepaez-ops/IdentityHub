# Reescaneo semanal.
#
# Captura los CVE que aparecen en código que no ha cambiado: una dependencia
# segura el lunes puede tener un aviso publicado el jueves sin que nadie toque
# el repositorio. Es la parte "continua" del DevSecOps que casi nunca se
# entrega, y sin ella el escaneo solo protege del código nuevo.
name: Escaneo semanal

on:
  schedule:
    - cron: "0 6 * * 1"   # lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Reescaneo de dependencias e imágenes publicadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        id: govuln
        continue-on-error: true
        working-directory: backend
        # `shell: bash` activa pipefail: sin él, `govulncheck | tee` devuelve el
        # estado de tee (0) y el paso siguiente, que abre la incidencia cuando
        # govulncheck falla, nunca se ejecutaba (el run 35547924202 encontró 33
        # vulnerabilidades y terminó en éxito).
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... | tee /tmp/govulncheck.txt

      - name: Abrir una incidencia si aparecen vulnerabilidades nuevas
        if: steps.govuln.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const salida = fs.readFileSync('/tmp/govulncheck.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Escaneo semanal: vulnerabilidades nuevas (${new Date().toISOString().slice(0, 10)})`,
              labels: ['seguridad', 'automático'],
              body: [
                'El reescaneo semanal encontró vulnerabilidades en código que no ha cambiado.',
                '',
                '```',
                salida,
                '```',
                '',
                'Registrar cada hallazgo en `security/findings/` antes de remediar.',
              ].join('\n'),
            });
