# ═══════════════════════════════════════════════════════════════════════════
#  Release — publica api, worker y web en Docker Hub (ADR 0011, T17 / C3).
#
#  Se dispara solo con un tag vX.Y.Z (sin sufijo), así que nunca publica
#  v0.0.0-vuln-baseline ni v0.1.0-hardened (ADR 0007).
#
#  Dos fases, para que un release publique las tres imágenes o ninguna:
#    1. gate    — construye y escanea cada imagen con el mismo gate de Trivy que
#                 CI y la guarda como artefacto.
#    2. publish — solo si las tres pasaron: carga la MISMA imagen escaneada (no
#                 la reconstruye), la sube con vX.Y.Z, la firma con
#                 Cosign keyless (OIDC del workflow), le adjunta el SBOM
#                 CycloneDX de Syft como atestación, verifica ambas; recién entonces mueve
#                 latest a ese digest (solo si es la versión más alta).
#
#  Credenciales: variable DOCKERHUB_NAMESPACE (repo) y secreto DOCKERHUB_TOKEN
#  (environment protegido "dockerhub", restringido a tags v*). La fase 1 no
#  tiene acceso a ninguno de los dos.
# ═══════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Construir y escanear ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
            target: api
          - name: worker
            context: backend
            file: backend/Dockerfile
            target: worker
          - name: web
            context: .
            file: frontend/Dockerfile
            target: web
    env:
      LOCAL_TAG: identity-hub/${{ matrix.name }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Mismo gate que CI (RNF-004): no se publica una imagen con CVE HIGH/CRITICAL corregibles.
      - name: Trivy — romper si hay CVE corregibles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: security/.trivyignore
          exit-code: "1"

      - name: Guardar la imagen escaneada
        run: docker save "${LOCAL_TAG}" -o "image-${{ matrix.name }}.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: image-${{ matrix.name }}.tar
          if-no-files-found: error
          # Margen para repetir solo el job de publicación si falla; en un repositorio
          # público el almacenamiento de artefactos no tiene costo.
          retention-days: 7

  publish:
    name: Publicar ${{ matrix.name }}
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # Cosign keyless
    strategy:
      fail-fast: false
      matrix:
        name: [api, worker, web]
    env:
      LOCAL_TAG: identity-hub/${{ matrix.name }}:${{ github.ref_name }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/identity-hub-${{ matrix.name }}
      VERSION: ${{ github.ref_name }}
      # Identidad esperada en la firma (solo este workflow, en un tag) y emisor OIDC. Los usan la verificación y el resumen.
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      CERT_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.name }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Se sube exactamente la imagen que pasó el gate: se carga del artefacto, no se reconstruye.
      # Solo vX.Y.Z: latest se mueve al final, cuando la firma y el SBOM ya están publicados.
      # Los pasos de red se reintentan (3 intentos con espera creciente) ante fallos transitorios.
      - name: Publicar ${{ matrix.name }}:${{ github.ref_name }}
        id: push
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::intento $i falló: $*"; [ "$i" -lt 3 ] && sleep $((i * 15)); done; return 1; }
          docker load -i "image-${{ matrix.name }}.tar"
          docker tag "${LOCAL_TAG}" "${IMAGE}:${VERSION}"
          retry docker push "${IMAGE}:${VERSION}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")"
          digest="${digest#*@}"
          [[ "${digest}" == sha256:* ]] || { echo "::error::digest no encontrado"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: SBOM CycloneDX (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: sbom-${{ matrix.name }}-${{ env.VERSION }}.cdx.json
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Se firma el digest, no la etiqueta: latest y vX.Y.Z apuntan al mismo manifiesto.
      - name: Firmar y atestar el SBOM (Cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.name }}.cdx.json
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::intento $i falló: $*"; [ "$i" -lt 3 ] && sleep $((i * 15)); done; return 1; }
          retry cosign sign --yes "${IMAGE}@${DIGEST}"
          retry cosign attest --yes --type cyclonedx --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      # Verificación posterior a la firma: si falla, el job termina aquí y latest no se mueve.
      - name: Verificar firma y atestación
        # La identidad se restringe a este workflow en un tag: una firma hecha desde otro workflow
        # o rama del repositorio no pasa. Probado contra v0.9.1 (y rechaza la identidad de ci.yml).
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::intento $i falló: $*"; [ "$i" -lt 3 ] && sleep $((i * 15)); done; return 1; }
          retry cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" --certificate-oidc-issuer "${OIDC_ISSUER}"
          # La atestación verificada trae el SBOM completo: imprimirla alargaba el paso a varios minutos.
          # Solo se descarta la salida de cosign; los avisos de reintento de retry siguen en el log.
          quiet() { "$@" >/dev/null; }
          retry quiet cosign verify-attestation --type cyclonedx "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" --certificate-oidc-issuer "${OIDC_ISSUER}"
          echo "Firma y atestación CycloneDX verificadas para ${IMAGE}@${DIGEST}"

      # latest solo apunta a una imagen ya firmada y atestada, y solo si este tag es el tag
      # vX.Y.Z más alto del repositorio: repetir el release de un tag viejo no hace retroceder latest.
      - name: Mover latest al digest firmado
        id: latest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::intento $i falló: $*"; [ "$i" -lt 3 ] && sleep $((i * 15)); done; return 1; }
          retry git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" > tags.txt
          highest="$(sed 's|.*refs/tags/||' tags.txt | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          [[ -n "${highest}" ]] || { echo "::error::no se pudo determinar la versión más alta"; exit 1; }
          if [[ "${highest}" != "${VERSION}" ]]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "::notice::latest no se mueve: ${VERSION} no es la versión más alta (${highest})"
            exit 0
          fi
          docker tag "${LOCAL_TAG}" "${IMAGE}:latest"
          retry docker push "${IMAGE}:latest"
          latest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          [[ "${latest}" == "${DIGEST}" ]] || { echo "::error::latest (${latest}) no coincide con el digest firmado (${DIGEST})"; exit 1; }
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Resumen
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MOVED: ${{ steps.latest.outputs.moved }}
        run: |
          tags="\`${VERSION}\`"; [[ "${MOVED}" == "true" ]] && tags="${tags}, \`latest\`"
          {
            echo "### ${IMAGE}"
            echo "- Etiquetas: ${tags}"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Firma y SBOM: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '${CERT_IDENTITY_REGEXP}' --certificate-oidc-issuer '${OIDC_ISSUER}'\`"
          } >> "$GITHUB_STEP_SUMMARY"
