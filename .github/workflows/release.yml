# ═══════════════════════════════════════════════════════════════════════════
#  Release — publica api, worker y web en Docker Hub (ADR 0011, T17 / C3).
#
#  Se dispara solo con un tag vX.Y.Z (sin sufijo), así que nunca publica
#  v0.0.0-vuln-baseline ni v0.1.0-hardened (ADR 0007). Cada imagen pasa el
#  mismo gate de Trivy que CI antes del push; después se firma con Cosign
#  keyless (OIDC del workflow) y se le adjunta el SBOM CycloneDX de Syft como
#  atestación. Etiquetas: vX.Y.Z y latest.
#
#  Credenciales: variable DOCKERHUB_NAMESPACE (repo) y secreto DOCKERHUB_TOKEN
#  (environment protegido "dockerhub", restringido a tags v*).
# ═══════════════════════════════════════════════════════════════════════════
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # Cosign keyless
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
            target: api
          - name: worker
            context: backend
            file: backend/Dockerfile
            target: worker
          - name: web
            context: .
            file: frontend/Dockerfile
            target: web
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/identity-hub-${{ matrix.name }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir ${{ matrix.name }} (local, para el gate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Mismo gate que CI (RNF-004): no se publica una imagen con CVE HIGH/CRITICAL corregibles.
      - name: Trivy — romper si hay CVE corregibles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: security/.trivyignore
          exit-code: "1"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mismo contexto y caché que el paso anterior: Buildx reutiliza las capas ya construidas.
      - name: Publicar ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: SBOM CycloneDX (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.name }}.cdx.json
          artifact-name: sbom-${{ matrix.name }}-${{ env.VERSION }}.cdx.json
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Se firma el digest, no la etiqueta: latest y vX.Y.Z apuntan al mismo manifiesto.
      - name: Firmar y atestar el SBOM (Cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.name }}.cdx.json
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      - name: Resumen
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "- Etiquetas: \`${VERSION}\`, \`latest\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Firma y SBOM: \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
