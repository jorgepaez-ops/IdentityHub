# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Entorno de DESARROLLO — construye desde el código local. Imágenes base   ║
# ║  con soporte, fijadas por digest, y los tres servicios propios            ║
# ║  endurecidos (read_only, cap_drop, no-new-privileges) desde T30.          ║
# ║  Historia (ver specs/adr/0007): esta línea base sembraba a propósito      ║
# ║  VULN-019 (imágenes base antiguas) y VULN-024 (sin endurecimiento; el     ║
# ║  comentario original de este archivo lo llamaba "VULN-020", que en       ║
# ║  realidad es el hallazgo de chi RealIP — ver VULN-024, Q9).               ║
# ║                                                                          ║
# ║  El compose de producción (docker-compose.prod.yml) llega en la semana 3: ║
# ║  imágenes firmadas desde GHCR y secretos por entorno gestionado.          ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: identity-hub

services:
  # ── Datos ───────────────────────────────────────────────────────────────
  db:
    # postgres:16-bookworm, con soporte, fijado por digest real.
    image: postgres@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in the repository root .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the repository root .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set in the repository root .env}"
      # Leída solo por deploy/postgres-init/01-identity-app-role.sh (Q21):
      # da login a identity_app (creado NOLOGIN por la migración 000002, T9).
      IDENTITY_APP_PASSWORD: "${IDENTITY_APP_PASSWORD:?IDENTITY_APP_PASSWORD must be set in the repository root .env}"
    # Q12 (2026-09-19) — publicado al host a propósito en desarrollo (acceso
    # directo con un cliente psql local); se revisa en docker-compose.prod.yml
    # en la semana 3, no aquí.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Corre una sola vez, cuando el volumen está vacío (ver el script).
      - ./postgres-init/01-identity-app-role.sh:/docker-entrypoint-initdb.d/01-identity-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  broker:
    # rabbitmq:4-management, con soporte, fijado por digest real.
    image: rabbitmq@sha256:ddc75301edf58a8332934cf2d801be7cbf8d65c6458d747364a8046238ff1c89
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set in the repository root .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in the repository root .env}"
    # Q12 (2026-09-19) — mismo criterio que `db`: publicado a propósito en
    # desarrollo, se revisa en docker-compose.prod.yml en la semana 3.
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # interfaz de administración
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mailpit:
    # Servidor SMTP de captura: recoge todo el correo saliente y lo muestra en
    # una interfaz web. No es un broker — esa función la cumple RabbitMQ.
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # interfaz web y API HTTP que consultan las pruebas E2E
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migraciones ─────────────────────────────────────────────────────────
  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL must be set in the repository root .env}"
      - "up"
    restart: on-failure

  # ── Aplicación ──────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      target: api
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      API_PORT: 8081
      LOG_LEVEL: debug
      APP_VERSION: 0.1.0-baseline
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in the repository root .env}"
      RABBITMQ_URL: "${RABBITMQ_URL:?RABBITMQ_URL must be set in the repository root .env}"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@identity.local
      JWT_ISSUER: http://localhost:8080
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in the repository root .env}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:?TRUSTED_PROXIES must be set in the repository root .env}"
    ports:
      - "8081:8081"
    healthcheck:
      # La imagen distroless (T27) no tiene shell ni curl: el binario se
      # autosondea con su propio subcomando "healthcheck".
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    # T30 — endurecimiento (VULN-024): sistema de archivos raíz de solo
    # lectura (el binario no escribe nada en disco), sin capacidades Linux y
    # sin poder escalar privilegios. El usuario no-root ya lo fija la imagen
    # (T27, distroless nonroot); tmpfs por si algo de la stdlib de Go
    # necesita un temporal (perfiles, TLS), aunque hoy no le hace falta.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

  worker:
    build:
      context: ../backend
      target: worker
    depends_on:
      broker:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: debug
      APP_VERSION: 0.1.0-baseline
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in the repository root .env}"
      RABBITMQ_URL: "${RABBITMQ_URL:?RABBITMQ_URL must be set in the repository root .env}"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@identity.local
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in the repository root .env}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:?TRUSTED_PROXIES must be set in the repository root .env}"
    ports:
      - "9091:9091"  # /metrics del worker
    restart: unless-stopped
    # T30 — endurecimiento (VULN-024): mismo razonamiento que `api`.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

  web:
    build:
      context: ../frontend
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    # T30 — endurecimiento (VULN-024): el usuario no-root ya lo fija la
    # imagen (T28, nginx-unprivileged); `nginx.conf` ya manda sus temporales
    # (proxy_temp, client_temp, el pidfile) a /tmp, así que basta con tmpfs
    # ahí para poder correr con el resto del filesystem en solo lectura.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

  # ── Observabilidad (perfil aparte) ──────────────────────────────────────
  # Se arranca con:  docker compose --profile observability up -d
  # Fuera del perfil por defecto para no cargar cuatro contenedores más en cada
  # ciclo de desarrollo.
  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.4
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  alloy:
    # Grafana Alloy sustituye a Promtail, que está descontinuado.
    image: grafana/alloy:v1.0.0
    profiles: ["observability"]
    depends_on: [loki]
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.river"

  grafana:
    image: grafana/grafana:10.4.0
    profiles: ["observability"]
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in the repository root .env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in the repository root .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  rabbitdata:
  grafanadata:
