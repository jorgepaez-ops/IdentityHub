# AM-019: alerta de la cola de mensajes muertos (DLQ) de notificaciones.
# Runbook: docs/runbooks/dlq-notificaciones.md
apiVersion: 1

groups:
  - orgId: 1
    name: identity-hub-broker
    folder: Identity Hub
    interval: 1m
    rules:
      - uid: identity-dlq-not-empty
        title: DLQ de notificaciones con mensajes
        condition: C
        for: 2m
        # Without data (broker down, scrape broken, metric renamed) emails may be failing too, so alert.
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
          service: broker
        annotations:
          summary: "La cola notifications.dlq tiene {{ $values.B.Value }} mensaje(s)"
          description: >-
            Hay eventos que el worker no pudo entregar tras agotar los reintentos de la cola
            (x-delivery-limit) y terminaron en notifications.dlq: algún correo no salió. Si la
            alerta indica falta de datos, Prometheus no está leyendo las métricas del broker.
          runbook_url: https://github.com/jorgepaez-ops/IdentityHub/blob/main/docs/runbooks/dlq-notificaciones.md
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(rabbitmq_detailed_queue_messages{queue="notifications.dlq"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
