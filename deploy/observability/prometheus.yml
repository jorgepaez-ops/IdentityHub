# Configuración de Prometheus (RNF-007).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]
        labels: { service: api }

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels: { service: worker }

  # RabbitMQ 3.11 expone métricas nativas en el puerto 15692 con el plugin
  # rabbitmq_prometheus, habilitado por defecto en las imágenes -management.
  - job_name: rabbitmq
    static_configs:
      - targets: ["broker:15692"]
        labels: { service: broker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
