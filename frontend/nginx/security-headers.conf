# RNF-009 — las cinco cabeceras de seguridad, compartidas por los dos
# `server` (Hub y Contabilidad). La CSP la define cada `server` en `$csp`
# (acotada a su propio origen). Se incluye también en las `location` que
# declaran su propio add_header (p. ej. /assets/): nginx descarta las
# cabeceras heredadas en cuanto una `location` define una propia.
add_header Content-Security-Policy   $csp always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
