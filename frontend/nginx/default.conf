# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ⚠️  CONFIGURACIÓN DELIBERADAMENTE INSEGURA — NO CORREGIR SIN LEER ESTO   ║
# ║                                                                          ║
# ║  Ver specs/adr/0007-linea-base-vulnerable-deliberada.md                   ║
# ║                                                                          ║
# ║    VULN-013  sin CSP, HSTS, X-Frame-Options ni nosniff  → OWASP ZAP       ║
# ║    VULN-014  server_tokens on: filtra la versión        → OWASP ZAP       ║
# ║    VULN-015  sin limit_req en /api/v1/auth/*            → AM-001, AM-017  ║
# ║                                                                          ║
# ║  La versión remediada (semana 3) añade las cinco cabeceras de RNF-009,    ║
# ║  apaga server_tokens y limita la tasa de los endpoints de autenticación.  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# VULN-014 — Deja ver "nginx/1.2.3" en cada respuesta y en las páginas de error.
# No es una vulnerabilidad por sí misma, pero regala al atacante el trabajo de
# averiguar contra qué versión exacta buscar exploits.
server_tokens on;

upstream api {
    server api:8081;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # AM-018 — Ninguna operación del contrato necesita más de 1 MiB.
    client_max_body_size 1m;

    # ── SPA ───────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # VULN-013 — Aquí es donde faltan las cabeceras de seguridad de RNF-009:
    #   add_header Content-Security-Policy   "default-src 'self'; ..." always;
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   add_header X-Content-Type-Options    "nosniff" always;
    #   add_header X-Frame-Options           "DENY" always;
    #   add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Se dejan comentadas a propósito para que el escaneo DAST las eche en falta.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los activos con hash en el nombre son inmutables; cachearlos un año es
    # seguro y ahorra tráfico.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy hacia la API ────────────────────────────────────────────────
    # VULN-015 — Sin `limit_req`, el endpoint de login queda expuesto a fuerza
    # bruta (AM-001) y, como cada verificación cuesta 64 MiB de Argon2id,
    # también a denegación de servicio por agotamiento de memoria (AM-017).
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /healthz { proxy_pass http://api/healthz; }
    location = /readyz  { proxy_pass http://api/readyz;  }

    location /.well-known/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # /metrics no se proxea nunca: solo Prometheus, desde la red interna de
    # Docker, alcanza el puerto de la API.
}
