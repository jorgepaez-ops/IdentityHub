# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Cabeceras de seguridad (RNF-009), server_tokens apagado y limit_req      ║
# ║  sobre /api/v1/auth/ (T29). Historia (ver specs/adr/0007): esta línea     ║
# ║  base sembraba a propósito VULN-013 (sin CSP/HSTS/X-Frame-Options/        ║
# ║  nosniff), VULN-014 (server_tokens on) y VULN-015 (sin limit_req).        ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# No revela "nginx/x.y.z" en las respuestas ni en las páginas de error.
server_tokens off;

# T29 — límite de tasa para /api/v1/auth/*: sin esto, el login queda expuesto
# a fuerza bruta (AM-001) y, como cada verificación cuesta 64 MiB de
# Argon2id, también a denegación de servicio por agotamiento de memoria
# (AM-017).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream api {
    server api:8081;
    keepalive 16;
}

# D10 / T11 — dos dominios locales sobre el mismo puerto: el Hub en
# identityhub.localhost y la aplicación Contabilidad en contabilidad.localhost.
# Los navegadores resuelven *.localhost a la propia máquina sin /etc/hosts.
# El Hub es además `default_server`: http://localhost:8080 sigue sirviéndolo
# (CI, ZAP y los escaneos locales apuntan ahí).
server {
    listen 8080 default_server;
    server_name identityhub.localhost;

    # AM-018 — Ninguna operación del contrato necesita más de 1 MiB.
    client_max_body_size 1m;

    # ── SPA ───────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # RNF-009 — cabeceras en security-headers.conf. CSP sin 'unsafe-inline': la
    # SPA construida con Vite solo carga un <script type="module"> y una hoja
    # de estilo externos, ninguno inline, así que no hace falta relajarla.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los activos con hash en el nombre son inmutables; cachearlos un año es
    # seguro y ahorra tráfico.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # ── Proxy hacia la API ────────────────────────────────────────────────
    # T29 — `/api/v1/auth/` es más específica que `/api/` y nginx la prefiere
    # por prefijo más largo: aquí se aplica `limit_req` a los endpoints de
    # autenticación (login, registro, refresh, etc.) sin afectar al resto.
    location /api/v1/auth/ {
        # Por defecto nginx responde 503 al recortar por limit_req; el
        # contrato OpenAPI de estos endpoints ya declara 429 para "demasiadas
        # peticiones", así que se sobrescribe el código.
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sobrescribe la cabecera del cliente en vez de anexarla
        # ($proxy_add_x_forwarded_for): complementa TRUSTED_PROXIES (T6) en
        # vez de dejar que quien llame se autodeclare "vengo de tal IP".
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /healthz { proxy_pass http://api/healthz; }
    location = /readyz  { proxy_pass http://api/readyz;  }

    location /.well-known/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # T9/T11 — endpoints OAuth del Hub (/oauth/authorize y /oauth/token). El
    # callback de Contabilidad (/oauth/callback) vive en el otro `server`.
    location /oauth/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # /metrics no se proxea nunca: solo Prometheus, desde la red interna de
    # Docker, alcanza el puerto de la API.
}

# T11/T13 — Contabilidad: SPA propia (contabilidad/), compilada en la misma imagen.
# Su CSP se acota a su propio origen más el Hub, al que llama con fetch para
# canjear el código (/oauth/token) y leer el JWKS. El origen del Hub está fijado
# a mano aquí y en contabilidad/src/config.ts (aceptado por ahora).
server {
    listen 8080;
    server_name contabilidad.localhost;

    client_max_body_size 1m;

    root /usr/share/nginx/contabilidad;
    index index.html;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://identityhub.localhost:8080; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    include /etc/nginx/security-headers.conf;

    # Cualquier ruta (incluido /oauth/callback) cae en la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
